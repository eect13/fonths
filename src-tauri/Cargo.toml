[package]
name = "fonths"
version = "2.1.0"
description = "Fonths — high-performance Tauri v2 + Skia (FreeType + HarfBuzz) + Fontations typeface manager"
edition = "2021"
rust-version = "1.87"

[lib]
name = "fonths_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
skia-safe = { version = "0.157", features = ["textlayout", "embed-freetype", "freetype-woff2"] }
read-fonts = "0.47"
lru = "0.19"
memmap2 = "0.9"
wuff = "0.2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
