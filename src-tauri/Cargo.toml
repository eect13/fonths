[package]
name = "fonths"
version = "2.4.0"
description = "Fonths — high-performance Tauri v2 + Google Fontations (read-fonts + skrifa + harfrust) typeface manager"
edition = "2024"
rust-version = "1.88"

[lib]
name = "fonths_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
read-fonts = "0.47"
skrifa = "0.50"
harfrust = "0.16"
tiny-skia = "0.12"
rayon = "1.12"
lru = "0.19"
memmap2 = "0.9"
wuff = "0.2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
